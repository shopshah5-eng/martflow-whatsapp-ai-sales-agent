[build]
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Content-Type-Options = "nosniff"

# Retire the legacy admin page in favor of the server-authorized portal.
[[redirects]]
  from = "/admin.html"
  to = "/admin"
  status = 302
  force = true

# Dedicated Application Routes
[[redirects]]
  from = "/app/*"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/dashboard/*"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/signup"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/forgot-password"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/demo"
  to = "/demo.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/catalog-admin.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/catalog-admin.html"
  status = 200

[[redirects]]
  from = "/superadmin/*"
  to = "/catalog-admin.html"
  status = 200

[[redirects]]
  from = "/superadmin"
  to = "/catalog-admin.html"
  status = 200

# API requests proxy to backend service
[[redirects]]
  from = "/api/*"
  to = "https://martflow-whatsapp-ai-sales-agent.onrender.com/api/:splat"
  status = 200
  force = true

# Unknown paths must not masquerade as the homepage
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
