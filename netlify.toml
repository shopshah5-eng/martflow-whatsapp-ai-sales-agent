[build]
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"

# API requests proxy to backend service
[[redirects]]
  from = "/api/*"
  to = "https://martflow-whatsapp-ai-sales-agent.onrender.com/api/:splat"
  status = 200
  force = true

# Single Page Application HTML fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
