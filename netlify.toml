[build]
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"

# Dedicated Application Routes
[[redirects]]
  from = "/app/*"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/dashboard/*"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/signup"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/forgot-password"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# API requests proxy to backend service
[[redirects]]
  from = "/api/*"
  to = "https://martflow-whatsapp-ai-sales-agent.onrender.com/api/:splat"
  status = 200
  force = true

# Single Page Application HTML fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
