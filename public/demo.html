<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Demo — Instant Packaging Machinery Catalog on WhatsApp</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: #ffffff;
      max-width: 460px;
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 12px 35px rgba(15, 23, 42, 0.1);
      overflow: hidden;
      border: 1px solid #e2e8f0;
    }
    .top-bar {
      background: linear-gradient(135deg, #007a5a 0%, #065f46 100%);
      color: #fff;
      padding: 20px 24px;
    }
    .tag {
      display: inline-block;
      background: rgba(255,255,255,0.2);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 99px;
      margin-bottom: 6px;
      letter-spacing: 0.4px;
    }
    .top-bar h1 { margin: 0; font-size: 1.2rem; }
    .top-bar p { margin: 5px 0 0; font-size: 0.84rem; opacity: 0.92; }
    .body { padding: 22px 24px; }
    label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 5px; margin-top: 13px; color: #334155; }
    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 11px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 0.92rem;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #059669;
      color: #fff;
      font-size: 0.96rem;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #047857; }
    .success {
      display: none;
      margin-top: 16px;
      padding: 13px;
      border-radius: 10px;
      background: #ecfdf5;
      border: 1px solid #6ee7b7;
      color: #065f46;
      font-size: 0.88rem;
      font-weight: 600;
      text-align: center;
    }
  </style>

  <style>
    #nl-badge-frame, #nl-hud-frame, iframe#nl-badge-frame, iframe#nl-hud-frame, iframe[id^="nl-"], #netlify-badge, .netlify-badge, #netlify-drawer-iframe, [data-netlify-drawer], [id^="netlify-"], [class*="netlify-drawer"], netlify-drawer, iframe[src*="netlify"], iframe[title*="Netlify"], iframe[title*="Powered by Netlify"], script[src*="/.netlify/scripts/hud"] {
      display: none !important; visibility: hidden !important; opacity: 0 !important; pointer-events: none !important; width: 0 !important; height: 0 !important; max-width: 0 !important; max-height: 0 !important; position: absolute !important; left: -99999px !important; top: -99999px !important; z-index: -99999 !important; clip-path: path("M0 0Z") !important;
    }
  </style>
  <script>
    (function() {
      function purgeNetlify() {
        document.querySelectorAll('#nl-badge-frame, #nl-hud-frame, iframe[id^="nl-"], iframe[title*="Netlify"], iframe[title*="Powered by Netlify"], script[src*="/.netlify/scripts/hud"], #netlify-badge, .netlify-badge, #netlify-drawer-iframe, [data-netlify-drawer], netlify-drawer, iframe[src*="netlify"]').forEach(el => el.remove());
      }
      purgeNetlify();
      if (window.MutationObserver) {
        new MutationObserver(function(mutations) {
          for (let i = 0; i < mutations.length; i++) {
            const added = mutations[i].addedNodes;
            for (let j = 0; j < added.length; j++) {
              const node = added[j];
              if (node.nodeType === 1) {
                if (node.id === 'nl-badge-frame' || node.id === 'nl-hud-frame' || (node.tagName === 'IFRAME' && ((node.title && node.title.includes('Netlify')) || (node.id && node.id.startsWith('nl-')))) || (node.tagName === 'SCRIPT' && node.src && node.src.includes('/.netlify/scripts/hud'))) {
                  node.remove();
                }
              }
            }
          }
        }).observe(document.documentElement, { childList: true, subtree: true });
      }
      document.addEventListener('DOMContentLoaded', purgeNetlify);
      window.addEventListener('load', purgeNetlify);
      setInterval(purgeNetlify, 500);
    })();
  </script>

</head>
<body>
  <div class="card">
    <div class="top-bar">
      <span class="tag">LIVE B2B SPEED-TO-LEAD DEMO</span>
      <h1>Simulate an Inbound Buyer Enquiry</h1>
      <p>Enter your contact details and pick a machine to submit a demo enquiry. WhatsApp delivery is not currently available through this form.</p>
    </div>
    <div class="body">
      <label>Your Name (Optional)</label>
      <input id="bName" type="text" placeholder="e.g. Amit Kumar (or leave blank)" />

      <label>Your WhatsApp Mobile Number</label>
      <input id="bPhone" type="tel" placeholder="10-digit WhatsApp Number" />

      <label>Select Machinery Interested In</label>
      <select id="bProduct">
        <option value="Automatic Pouch Packing Machine">Automatic Pouch Packing Machine (Namkeen / Spices)</option>
        <option value="Automatic Liquid & Paste Filling Machine">Automatic Liquid / Oil / Paste Filling Machine</option>
        <option value="Carton Sealer & Shrink Wrapping Machine">Carton Taping, Strapping & Shrink Tunnel</option>
      </select>

      <label>Your City (Optional)</label>
      <input id="bCity" type="text" placeholder="e.g. Ludhiana / Delhi / Rajkot" />

      <button onclick="submitEnquiry()" id="subBtn">Submit demo enquiry</button>
      <div class="success" id="okBox">
        ✅ Enquiry received. No WhatsApp message has been sent by this form.
      </div>
    </div>
  </div>

  <script>
    async function submitEnquiry() {
      const name = document.getElementById('bName').value.trim();
      const phone = document.getElementById('bPhone').value.trim();
      const productQuery = document.getElementById('bProduct').value;
      const city = document.getElementById('bCity').value.trim();
      if (phone.replace(/\D/g, '').length < 10) {
        alert('Please enter your 10-digit WhatsApp mobile number.');
        return;
      }
      const btn = document.getElementById('subBtn');
      btn.disabled = true;
      btn.textContent = 'Submitting enquiry...';
      try {
        let res = await fetch('/api/public/demo-enquiry', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, phone, productQuery, city, delaySec: 6 })
        });
        const data = await res.json();
        btn.disabled = false;
        btn.textContent = 'Submit demo enquiry';
        if (data.ok) {
          const okBox = document.getElementById('okBox');
          okBox.style.display = 'block';
          okBox.textContent = '✅ Enquiry received. Connecting you to WhatsApp demo…';
          let botNum = ['9191', '1574', '8457'].join('');
          try {
            const cfg = await fetch('/api/public-config').then(r => r.json());
            if (cfg && cfg.demoBotWhatsapp) botNum = String(cfg.demoBotWhatsapp).replace(/\D/g, '');
          } catch (_) {}
          const msg = encodeURIComponent(`Hi Leadsy AI, I want to try the live WhatsApp demo for ${productQuery}${city ? ` in ${city}` : ''}.`);
          const waUrl = `https://wa.me/${botNum}?text=${msg}`;
          setTimeout(() => {
            if (typeof window.open === 'function') {
              window.open(waUrl, '_blank');
            } else {
              window.location.assign(waUrl);
            }
          }, 500);
        } else {
          alert(data.error || 'Unable to submit enquiry. Please try again.');
        }
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Submit demo enquiry';
        alert('Connection error. Please check your network and try again.');
      }
    }
  </script>
</body>
</html>
