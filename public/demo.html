<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatsApp Demo | Leadsy AI</title>
  <meta name="description" content="Request a Leadsy AI WhatsApp demo and continue the conversation on WhatsApp.">
  <link rel="icon" type="image/png" href="/assets/leadsy-mark.png">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: #ffffff;
      max-width: 460px;
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 12px 35px rgba(15, 23, 42, 0.1);
      overflow: hidden;
      border: 1px solid #e2e8f0;
    }
    .top-bar {
      background: linear-gradient(135deg, #007a5a 0%, #065f46 100%);
      color: #fff;
      padding: 20px 24px;
    }
    .tag {
      display: inline-block;
      background: rgba(255,255,255,0.2);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 99px;
      margin-bottom: 6px;
      letter-spacing: 0.4px;
    }
    .top-bar h1 { margin: 0; font-size: 1.2rem; }
    .top-bar p { margin: 5px 0 0; font-size: 0.84rem; opacity: 0.92; }
    .body { padding: 22px 24px; }
    label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 5px; margin-top: 13px; color: #334155; }
    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 11px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 0.92rem;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #059669;
      color: #fff;
      font-size: 0.96rem;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #047857; }
    .success {
      display: none;
      margin-top: 16px;
      padding: 13px;
      border-radius: 10px;
      background: #ecfdf5;
      border: 1px solid #6ee7b7;
      color: #065f46;
      font-size: 0.88rem;
      font-weight: 600;
      text-align: center;
    }
  </style>

  <style>
    #nl-badge-frame, #nl-hud-frame, iframe#nl-badge-frame, iframe#nl-hud-frame, iframe[id^="nl-"], #netlify-badge, .netlify-badge, #netlify-drawer-iframe, [data-netlify-drawer], [id^="netlify-"], [class*="netlify-drawer"], netlify-drawer, iframe[src*="netlify"], iframe[title*="Netlify"], iframe[title*="Powered by Netlify"], script[src*="/.netlify/scripts/hud"] {
      display: none !important; visibility: hidden !important; opacity: 0 !important; pointer-events: none !important; width: 0 !important; height: 0 !important; max-width: 0 !important; max-height: 0 !important; position: absolute !important; left: -99999px !important; top: -99999px !important; z-index: -99999 !important; clip-path: path("M0 0Z") !important;
    }
  </style>


</head>
<body>
  <main class="card">
    <div class="top-bar">
      <a href="/" style="color:#fff">← Leadsy home</a>
      <span class="tag">LIVE B2B SPEED-TO-LEAD DEMO</span>
      <h1>Simulate an Inbound Buyer Enquiry</h1>
      <p>Submit an enquiry, then choose whether to continue on WhatsApp. No message is sent automatically.</p>
    </div>
    <div class="body">
      <label for="bName">Your name (optional)</label>
      <input id="bName" type="text" maxlength="120" autocomplete="name" placeholder="e.g. Amit Kumar (or leave blank)" />

      <label for="bPhone">Your WhatsApp mobile number</label>
      <input id="bPhone" type="tel" maxlength="20" autocomplete="tel" placeholder="10-digit WhatsApp Number" />

      <label for="bProduct">What are you interested in?</label>
      <select id="bProduct">
        <option value="Other product or service">Other product or service</option>
        <option value="Automatic Pouch Packing Machine">Automatic Pouch Packing Machine (Namkeen / Spices)</option>
        <option value="Automatic Liquid & Paste Filling Machine">Automatic Liquid / Oil / Paste Filling Machine</option>
        <option value="Carton Sealer & Shrink Wrapping Machine">Carton Taping, Strapping & Shrink Tunnel</option>
      </select>

      <label for="bCity">Your city (optional)</label>
      <input id="bCity" type="text" maxlength="120" autocomplete="address-level2" placeholder="e.g. Ludhiana / Delhi / Rajkot" />

      <label><input type="checkbox" id="demoConsent" style="width:auto" /> I agree to be contacted about this enquiry.</label>
      <button type="button" onclick="submitEnquiry()" id="subBtn">Submit demo enquiry</button>
      <div class="success" id="okBox" role="status" aria-live="polite"></div>
      <p id="errorBox" role="alert" style="color:#b42318"></p>
    </div>
  </main>

  <script>
    async function submitEnquiry() {
      const name = document.getElementById('bName').value.trim();
      const phone = document.getElementById('bPhone').value.trim();
      const productQuery = document.getElementById('bProduct').value;
      const city = document.getElementById('bCity').value.trim();
      const errorBox = document.getElementById('errorBox');
      const okBox = document.getElementById('okBox');
      errorBox.textContent = ''; okBox.style.display = 'none'; okBox.replaceChildren();
      const digits = phone.replace(/\D/g, '');
      const national = digits.length === 12 && digits.startsWith('91') ? digits.slice(2) : digits;
      if (!/^[6-9]\d{9}$/.test(national) || /^(\d)\1{9}$/.test(national)) {
        errorBox.textContent = 'Please enter a valid 10-digit Indian mobile number.';
        return;
      }
      if (!document.getElementById('demoConsent').checked) {
        errorBox.textContent = 'Please agree to be contacted about this enquiry.';
        return;
      }
      const btn = document.getElementById('subBtn');
      btn.disabled = true; btn.textContent = 'Submitting enquiry...';
      try {
        const res = await fetch('/api/public/demo-enquiry', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, phone, productQuery, city })
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || 'Unable to submit enquiry. Please try again.');
        let botNum = '919115748457';
        try {
          const configResponse = await fetch('/api/public-config');
          if (configResponse.ok) {
            const cfg = await configResponse.json();
            const candidate = String(cfg.demoBotWhatsapp || '').replace(/\D/g, '');
            if (/^\d{10,15}$/.test(candidate)) botNum = candidate;
          }
        } catch (_) {}
        const text = `Hi Leadsy AI, I want to try the WhatsApp demo for ${productQuery}${city ? ` in ${city}` : ''}.`;
        const link = document.createElement('a');
        link.href = `https://wa.me/${botNum}?text=${encodeURIComponent(text)}`;
        link.target = '_blank'; link.rel = 'noopener noreferrer';
        link.textContent = 'Open WhatsApp demo →';
        okBox.append(document.createTextNode('Enquiry received. No WhatsApp message has been sent. '), link);
        okBox.style.display = 'block';
      } catch (err) {
        errorBox.textContent = err.message || 'Connection error. Please try again.';
      } finally {
        btn.disabled = false; btn.textContent = 'Submit demo enquiry';
      }
    }
  </script>
</body>
</html>
