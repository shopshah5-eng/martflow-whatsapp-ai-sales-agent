<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="ai-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#087F5B"/>
      <stop offset="100%" stop-color="#10A37F"/>
    </linearGradient>
    <filter id="ai-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#087F5B" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Background Canvas Card -->
  <rect x="20" y="20" width="560" height="440" rx="20" fill="#FFFFFF" stroke="#E5EAE7" stroke-width="1.5"/>
  <rect x="40" y="40" width="520" height="60" rx="12" fill="#F7FAF8"/>
  <circle cx="70" cy="70" r="16" fill="url(#ai-grad)"/>
  <path d="M66 65L74 70L66 75V65Z" fill="#FFFFFF"/>
  <text x="96" y="67" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#111827">MartFlow AI Neural Sales Core</text>
  <text x="96" y="84" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#64748B">Instant Natural Language Spec Matching • Active</text>

  <!-- Central Dialogue Node -->
  <g transform="translate(50, 130)" filter="url(#ai-shadow)">
    <!-- Buyer Query -->
    <rect x="0" y="0" width="340" height="74" rx="14" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="16" y="26" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#334155">Inbound Buyer Inquiry:</text>
    <text x="16" y="46" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#0F172A">"Need quotation for 2,000 meters of 4-core copper cable"</text>
    <rect x="280" y="10" width="48" height="20" rx="10" fill="#E2E8F0"/>
    <text x="290" y="24" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#475569">09:41</text>
  </g>

  <!-- Processing Core Vector -->
  <g transform="translate(420, 160)">
    <circle cx="50" cy="50" r="42" fill="url(#ai-grad)" fill-opacity="0.1" stroke="#087F5B" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="50" cy="50" r="30" fill="url(#ai-grad)"/>
    <path d="M42 50L48 56L58 44" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="14" y="110" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#087F5B">1.8s Response</text>
  </g>

  <!-- AI Reply Card -->
  <g transform="translate(90, 240)" filter="url(#ai-shadow)">
    <rect x="0" y="0" width="420" height="150" rx="14" fill="#E6F4F0" stroke="#C2E2D7"/>
    <text x="18" y="30" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#087F5B">Verified MartFlow Response (Sent via WhatsApp):</text>
    <text x="18" y="54" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#111827">"Namaste! We have 4-Core 2.5 sq mm Armoured Copper Cable in stock.</text>
    <text x="18" y="74" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#111827">Rate: ₹148/meter for 2,000m lot (MOQ 500m). ISI Certified IS:1554."</text>

    <!-- Attached Proforma / Spec badge -->
    <rect x="18" y="94" width="220" height="38" rx="8" fill="#FFFFFF" stroke="#087F5B" stroke-width="1"/>
    <rect x="26" y="102" width="22" height="22" rx="4" fill="#FEE2E2"/>
    <text x="30" y="117" font-family="Inter, sans-serif" font-size="8" font-weight="800" fill="#DC2626">PDF</text>
    <text x="56" y="114" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#111827">Cable_Spec_Sheet.pdf</text>
    <text x="56" y="126" font-family="Inter, sans-serif" font-size="9" font-weight="500" fill="#64748B">1.2 MB • Auto-Attached</text>

    <rect x="250" y="94" width="150" height="38" rx="8" fill="#087F5B"/>
    <text x="274" y="118" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">📅 Book Call Slot</text>
  </g>
</svg>