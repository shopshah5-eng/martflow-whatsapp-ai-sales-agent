<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="cat-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#087F5B"/>
      <stop offset="100%" stop-color="#10A37F"/>
    </linearGradient>
  </defs>
  <rect x="20" y="20" width="560" height="440" rx="20" fill="#FFFFFF" stroke="#E5EAE7" stroke-width="1.5"/>
  <rect x="50" y="50" width="500" height="150" rx="14" fill="#F7FAF8" stroke="#087F5B" stroke-width="1.8" stroke-dasharray="6 6"/>
  <circle cx="300" cy="95" r="24" fill="#E6F4F0"/>
  <path d="M300 85V105M300 85L292 93M300 85L308 93" stroke="#087F5B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="300" y="135" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#111827">Drag &amp; Drop Price Lists, PDF Brochures, Excel / CSV</text>
  <text x="300" y="155" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#64748B">Automatic parsing of Product Names, Specifications, MOQ, &amp; Tiered Pricing</text>

  <!-- Parsed SKU Table -->
  <g transform="translate(50, 220)">
    <rect width="500" height="200" rx="12" fill="#FFFFFF" stroke="#E5EAE7"/>
    <!-- Table Header -->
    <rect width="500" height="38" rx="12" fill="#F8FAFC"/>
    <text x="20" y="24" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#475569">SKU CODE</text>
    <text x="120" y="24" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#475569">PRODUCT NAME</text>
    <text x="270" y="24" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#475569">SPECIFICATIONS</text>
    <text x="380" y="24" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#475569">MOQ</text>
    <text x="440" y="24" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#475569">PRICE</text>

    <!-- Row 1 -->
    <line x1="0" y1="38" x2="500" y2="38" stroke="#E2E8F0"/>
    <text x="20" y="65" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#087F5B">MF-102</text>
    <text x="120" y="65" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#111827">SS 304 Ball Valve</text>
    <text x="270" y="65" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#64748B">1/2" to 2" 1000 WOG</text>
    <text x="380" y="65" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#111827">50 Pcs</text>
    <text x="440" y="65" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#087F5B">₹420</text>

    <!-- Row 2 -->
    <line x1="0" y1="92" x2="500" y2="92" stroke="#E2E8F0"/>
    <text x="20" y="119" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#087F5B">MF-208</text>
    <text x="120" y="119" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#111827">MS Flange Class 150</text>
    <text x="270" y="119" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#64748B">ANSI B16.5 A105 Forged</text>
    <text x="380" y="119" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#111827">100 Pcs</text>
    <text x="440" y="119" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#087F5B">₹680</text>

    <!-- Row 3 -->
    <line x1="0" y1="146" x2="500" y2="146" stroke="#E2E8F0"/>
    <text x="20" y="173" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#087F5B">MF-315</text>
    <text x="120" y="173" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#111827">Nylon Lock Nut M12</text>
    <text x="270" y="173" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#64748B">DIN 985 Zinc Plated</text>
    <text x="380" y="173" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#111827">5,000 Pcs</text>
    <text x="440" y="173" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#087F5B">₹3.20</text>
