<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" fill="none">
  <defs>
    <filter id="dash-shadow" x="-5%" y="-5%" width="110%" height="114%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#022c22" flood-opacity="0.10"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#022c22" flood-opacity="0.05"/>
    </filter>
    <linearGradient id="metric-grad-1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F7FAF8"/>
    </linearGradient>
  </defs>

  <!-- Window Container -->
  <g filter="url(#dash-shadow)">
    <rect x="10" y="10" width="940" height="580" rx="16" fill="#FFFFFF" stroke="#E5EAE7" stroke-width="1.5"/>
  </g>

  <!-- Top App Navigation Bar -->
  <rect x="10" y="10" width="940" height="54" rx="16" fill="#FAFCFB"/>
  <line x1="10" y1="64" x2="950" y2="64" stroke="#E5EAE7" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="36" cy="37" r="5" fill="#EF4444"/>
  <circle cx="52" cy="37" r="5" fill="#F59E0B"/>
  <circle cx="68" cy="37" r="5" fill="#10B981"/>

  <!-- Brand Title -->
  <g transform="translate(100, 26)">
    <rect width="24" height="24" rx="6" fill="#087F5B"/>
    <path d="M12 6L6 14H11L10 18L16 10H11L12 6Z" fill="#FFFFFF"/>
    <text x="32" y="17" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#111827">MartFlow <tspan fill="#087F5B">AI</tspan></text>
    <rect x="130" y="1" width="110" height="22" rx="11" fill="#E6F4F0" stroke="#C2E2D7" stroke-width="0.8"/>
    <circle cx="140" cy="12" r="3.5" fill="#087F5B"/>
    <text x="148" y="15" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#087F5B">Sales Engine Active</text>
  </g>

  <!-- Top Right Stats -->
  <g transform="translate(730, 24)">
    <rect width="190" height="28" rx="8" fill="#FFFFFF" stroke="#E5EAE7" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#10A37F"/>
    <text x="28" y="18" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#334155">WhatsApp: Connected</text>
  </g>

  <!-- SIDEBAR (LEFT) -->
  <rect x="10" y="65" width="200" height="525" fill="#FFFFFF"/>
  <line x1="210" y1="65" x2="210" y2="590" stroke="#E5EAE7" stroke-width="1"/>

  <g transform="translate(24, 85)">
    <!-- Active Nav Item: Overview -->
    <rect width="172" height="34" rx="8" fill="#E6F4F0"/>
    <circle cx="20" cy="17" r="5" fill="#087F5B"/>
    <text x="36" y="21" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#087F5B">Overview</text>

    <!-- Other Nav Items -->
    <g transform="translate(0, 42)">
      <text x="36" y="21" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#64748B">WhatsApp Inbox</text>
      <rect x="140" y="9" width="22" height="16" rx="8" fill="#F1F5F9"/>
      <text x="147" y="21" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#0F172A">12</text>
    </g>
    <g transform="translate(0, 78)">
      <text x="36" y="21" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#64748B">Leads Management</text>
