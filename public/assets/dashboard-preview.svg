      <text x="14" y="24" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#64748B">TOTAL ENQUIRIES</text>
      <text x="14" y="56" font-family="Inter, sans-serif" font-size="22" font-weight="800" fill="#111827">1,482</text>
      <text x="14" y="72" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#087F5B">↑ 18.4% this week</text>

      <!-- Card 2: Qualified Leads -->
      <g transform="translate(178, 0)">
        <rect width="165" height="84" rx="12" fill="url(#metric-grad-1)" stroke="#E5EAE7" stroke-width="1"/>
