        <text x="334" y="31" font-family="Inter, sans-serif" font-size="9.5" font-weight="700" fill="#B45309" text-anchor="middle">CALL BOOKED</text>
      </g>

      <!-- Row 3 -->
      <g transform="translate(16, 175)">
        <rect width="388" height="56" rx="8" fill="#FFFFFF" stroke="#E5EAE7" stroke-width="0.8"/>
        <circle cx="28" cy="28" r="14" fill="#64748B"/>
        <text x="24" y="32" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">V</text>
        <text x="50" y="22" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#111827">Vikas Shah <tspan font-weight="400" fill="#64748B">(Shah Automations)</tspan></text>
        <text x="50" y="40" font-family="Inter, sans-serif" font-size="10.5" font-weight="500" fill="#334155">Catalog PDF downloaded • MOQ confirmed</text>
        <rect x="290" y="16" width="88" height="22" rx="11" fill="#F1F5F9"/>
        <text x="334" y="31" font-family="Inter, sans-serif" font-size="9.5" font-weight="700" fill="#475569" text-anchor="middle">ENGAGED</text>
      </g>

      <!-- Row 4 -->
      <g transform="translate(16, 240)">
        <rect width="388" height="56" rx="8" fill="#FFFFFF" stroke="#E5EAE7" stroke-width="0.8"/>
        <circle cx="28" cy="28" r="14" fill="#087F5B"/>
        <text x="24" y="32" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">A</text>
        <text x="50" y="22" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#111827">Amit Verma <tspan font-weight="400" fill="#64748B">(Verma Industries)</tspan></text>
        <text x="50" y="40" font-family="Inter, sans-serif" font-size="10.5" font-weight="500" fill="#087F5B">Proforma invoice requested for 1,200 pcs</text>
        <rect x="290" y="16" width="88" height="22" rx="11" fill="#E6F4F0"/>
        <text x="334" y="31" font-family="Inter, sans-serif" font-size="9.5" font-weight="700" fill="#087F5B" text-anchor="middle">HIGH INTENT</text>
