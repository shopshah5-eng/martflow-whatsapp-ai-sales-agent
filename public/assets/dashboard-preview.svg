        <text x="12" y="20" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#111827">Micro Thermal Sensor (MF-TS1)</text>
        <text x="12" y="36" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#087F5B">₹195/pc <tspan font-weight="400" fill="#64748B">• MOQ: 200 pcs</tspan></text>
        <text x="12" y="52" font-family="Inter, sans-serif" font-size="9.5" font-weight="500" fill="#64748B">Fast dispatch • OEM packaging</text>
        <circle cx="218" cy="20" r="4" fill="#10A37F"/>
