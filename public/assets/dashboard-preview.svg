        <rect width="165" height="84" rx="12" fill="url(#metric-grad-1)" stroke="#E5EAE7" stroke-width="1"/>
        <text x="14" y="24" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#64748B">CALLS BOOKED</text>
