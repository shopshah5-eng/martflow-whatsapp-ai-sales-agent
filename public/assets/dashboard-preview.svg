      <text x="180" y="28" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#087F5B">38 Products</text>

      <!-- Catalog Item 1 -->
      <g transform="translate(16, 45)">
        <rect width="233" height="74" rx="8" fill="#F7FAF8" stroke="#E5EAE7" stroke-width="0.8"/>
        <text x="12" y="20" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#111827">Heavy Duty 15A Relay (MF-15R)</text>
        <text x="12" y="36" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#087F5B">₹240/pc <tspan font-weight="400" fill="#64748B">• MOQ: 100 pcs</tspan></text>
        <text x="12" y="52" font-family="Inter, sans-serif" font-size="9.5" font-weight="500" fill="#64748B">PDF Datasheet Attached • In Stock</text>
        <circle cx="218" cy="20" r="4" fill="#10A37F"/>
      </g>

      <!-- Catalog Item 2 -->
      <g transform="translate(16, 130)">
        <rect width="233" height="74" rx="8" fill="#FFFFFF" stroke="#E5EAE7" stroke-width="0.8"/>
        <text x="12" y="20" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#111827">Digital 3-Phase Timer (MF-T30)</text>
        <text x="12" y="36" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#087F5B">₹680/pc <tspan font-weight="400" fill="#64748B">• MOQ: 25 pcs</tspan></text>
        <text x="12" y="52" font-family="Inter, sans-serif" font-size="9.5" font-weight="500" fill="#64748B">CE Certified • Calibration report ready</text>
        <circle cx="218" cy="20" r="4" fill="#10A37F"/>
